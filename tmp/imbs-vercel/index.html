<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050d1d">
<title>IMBS Recording Tracker</title>
</head>
<body style="margin:0;background:#050d1d;color:#fff;font-family:system-ui">
<div id="loading" style="min-height:100vh;display:grid;place-items:center">Loading IMBS Recording Tracker...</div>
<script>
(async()=>{
  try{
    const base="https://cdn.jsdelivr.net/gh/adnimeshakalhara04-create/Days-paper@22ba68119defce7c59fee988c527699459273e95/tmp/imbs-vercel/";
    const parts=await Promise.all([1,2,3,4,5].map(async n=>{
      const r=await fetch(base+'part'+n+'.txt');
      if(!r.ok) throw new Error('Bundle part '+n+' HTTP '+r.status);
      return r.text();
    }));
    const html=atob(parts.join(''));
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('loading').textContent='Unable to load app: '+e.message;
  }
})();
</script>
</body>
</html>
